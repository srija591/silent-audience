# Render Blueprint: New + > Blueprint > pick this repo. Creates DB + API + static frontend.
databases:
  - name: silent-audience-db
    plan: free            # free DBs expire after 30 days -> use a paid plan (or Neon/Supabase) for real use
    databaseName: silent_audience
    user: silent_audience

services:
  - type: web
    name: silent-audience-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: silent-audience-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false        # set to your static site URL, e.g. https://silent-audience.onrender.com
      - key: MOCK_MODE
        value: auto
      - key: SARVAM_API_KEY
        sync: false        # paste in the dashboard, never commit
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: silent-audience
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false        # set to your API URL, e.g. https://silent-audience-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
